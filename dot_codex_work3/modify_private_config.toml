{{- /* chezmoi:modify-template */ -}}
{{- /* Kept byte-identical across dot_codex and dot_codex_work1/2/3:
chezmoi modify-templates cannot include .chezmoitemplates, so each Codex home
carries its own copy. These defaults only fill missing settings; existing
per-home values and additional settings take precedence. */ -}}
{{- $defaults := fromToml `
model = "gpt-6-astra"
model_reasoning_effort = "medium"
service_tier = "fast"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[marketplaces.worktrunk]
source_type = "git"
source = "https://github.com/max-sixty/worktrunk.git"

[plugins."worktrunk@worktrunk"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[features]
hooks = true
context_management.experimental_mode = true

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = false

[hooks.state]

[tui.model_availability_nux]
"gpt-5.6-sol" = 1
` -}}
{{- $_ := set $defaults "projects" (dict .chezmoi.sourceDir (dict "trust_level" "trusted")) -}}
{{- $cur := dict -}}
{{- if .chezmoi.stdin }}{{ $cur = fromToml .chezmoi.stdin }}{{ end -}}
{{- $merged := mergeOverwrite $defaults $cur -}}
{{- if deepEqual $cur $merged -}}
{{- .chezmoi.stdin -}}
{{- else -}}
{{- $merged | toToml -}}
{{- end -}}
