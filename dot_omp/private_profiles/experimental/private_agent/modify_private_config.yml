{{- /* chezmoi:modify-template */ -}}
{{- /* 起動: omp --profile experimental。認証とセッションは通常プロファイルから分離する。 */ -}}
{{- /* 初回は /login で anthropic、openai-codex、opencode-go、opencode-zen、xai-oauth の個人契約を登録する。 */ -}}
{{- /* Go の対象モデル: https://opencode.ai/docs/go/ 。Zen は比較用の Big Pickle のみ初期登録する。 */ -}}
{{- /* モデル割り当ては初期値。OMP 内で変更した値を chezmoi apply で戻さない。 */ -}}
{{- $config := dict
      "providers" dict
      "setupVersion" 2
      "modelRoles" (dict
        "default" "opencode-go/kimi-k2.7-code:high"
        "smol" "opencode-go/glm-5.3-flash:low"
        "tiny" "opencode-go/glm-5.3-flash:low"
        "task" "opencode-go/minimax-m3:medium"
        "plan" "opencode-go/kimi-k3:max"
        "slow" "xai-oauth/grok-4.6:xhigh"
        "advisor" "xai-oauth/grok-4.6:high"
        "review" "opencode-go/glm-5.3:max"
        "vision" "xai-oauth/grok-4.6:medium"
        "commit" "opencode-go/glm-5.3-flash:low"
        "zen" "opencode-zen/big-pickle:high")
      "advisor" (dict "enabled" true)
      "cycleOrder" (list "default" "plan" "slow" "review" "zen")
      "enabledModels" (list
        "opencode-go/kimi-k2.7-code"
        "opencode-go/kimi-k3"
        "opencode-go/glm-5.3-flash"
        "opencode-go/glm-5.3"
        "opencode-go/glm-5.2"
        "opencode-go/minimax-m3"
        "opencode-go/deepseek-v4.1-flash"
        "opencode-go/qwen3.7-plus"
        "opencode-go/mimo-v2.5"
        "xai-oauth/grok-4.6"
        "xai-oauth/grok-4.20-multi-agent-0309"
        "opencode-zen/big-pickle")
      "modelProviderOrder" (list "opencode-go" "xai-oauth" "opencode-zen")
      "task" (dict
        "agentModelOverrides" (dict
          "scout" "@smol"
          "sonic" "@smol"
          "task" "@task"
          "reviewer" "@review"
          "security-reviewer" "@slow"
          "browser-verifier" "@vision"
          "check-runner" "@smol")
        "agentAdvisor" (dict
          "scout" "off"
          "sonic" "off"
          "task" "off"
          "reviewer" "off"
          "security-reviewer" "off")
        "prewalk" false)
      "prewalk" (dict "enabled" false)
      "tier" (dict
        "openai" "none"
        "anthropic" "none"
        "subagent" "none"
        "advisor" "none")
-}}
{{- if .chezmoi.stdin -}}
{{-   $config = mergeOverwrite $config (fromYaml .chezmoi.stdin) -}}
{{- end -}}
{{- /* 既存プロファイルにもサブスクリプション用モデルを追加し、モデル割り当ては維持する。 */ -}}
{{- $subscriptionModels := list
      "openai-codex/gpt-5.6-sol"
      "openai-codex/gpt-5.6-luna"
      "openai-codex/gpt-5.6-terra"
      "openai-codex/gpt-6-astra"
      "anthropic/claude-opus-5"
      "anthropic/claude-sonnet-5"
      "anthropic/claude-haiku-4-5"
      "anthropic/claude-fable-5"
      "anthropic/claude-fable-5-1"
-}}
{{- $_ := set $config "enabledModels" (concat (get $config "enabledModels" | default list) $subscriptionModels | uniq) -}}
{{- $_ := set $config "modelProviderOrder" (concat (get $config "modelProviderOrder" | default list) (list "openai-codex" "anthropic") | uniq) -}}
{{- /* Claude と Codex の OAuth は許可し、仕事用 Devin と従量課金の OpenAI / xAI API は無効にする。 */ -}}
{{- $disabled := concat (without (get $config "disabledProviders" | default list) "openai-codex" "anthropic") (list "openai" "devin" "xai") | uniq -}}
{{- $_ := set $config "disabledProviders" $disabled -}}
{{- /* 判定モデルと通常プロファイル共通の表示・動作設定を強制する */ -}}
{{- $enforced := dict
      "modelRoles" (dict "judge" "typesafe/jev-latest")
      "retry" (dict "fallbackChains" (dict "judge" (list "opencode-go/glm-5.3-flash")))
      "find" (dict "enabled" true)
      "astGrep" (dict "enabled" true)
      "github" (dict "enabled" true)
      "checkpoint" (dict "enabled" true)
      "security" (dict "enabled" true)
      "secrets" (dict "enabled" true)
      "theme" (dict "dark" "dark-catppuccin" "light" "light-catppuccin")
      "symbolPreset" "nerd"
      "composer" (dict "shape" "claude" "tokenRate" true)
      "personality" "pragmatic"
      "startup" (dict "quiet" true)
      "showHardwareCursor" true
      "tui" (dict "imeSafeCursor" true)
      "statusLine" (dict "transparent" true)
      "terminal" (dict "showProgress" true)
      "display" (dict
        "cacheMissMarker" true
        "showTokenUsage" true
        "showTurnTime" true)
      "task" (dict
        "enableLsp" true
        "enableEffort" true
        "maxRuntimeMs" 0
        "showResolvedModelBadge" true
        "agentModelOverrides" (dict "scout" "@smol"))
      "dev" (dict "autoqa" false)
-}}
{{- $config = mergeOverwrite $config $enforced -}}
{{- toYaml $config | trim -}}
