{{- /* chezmoi:modify-template */ -}}
{{- /* omp が実行時に書き換えるキーは既存の値を引き継ぐ（下は新規マシン向けの初期値） */ -}}
{{- $config := dict
      "providers" dict
      "setupVersion" 2
      "modelRoles" (dict
        "default" "openai-codex/gpt-6-astra:low"
        "advisor" "anthropic/claude-fable-5-1:medium"
        "smol" "devin/glm-5-3-flash-1m:low"
        "tiny" "openai-codex/gpt-5.6-luna:low"
        "task" "devin/swe-2:medium"
        "plan" "openai-codex/gpt-6-astra:xhigh"
        "slow" "openai-codex/gpt-6-astra:xhigh"
        "review" "anthropic/claude-fable-5-1:high")
      "advisor" (dict "enabled" true)
      "cycleOrder" (list "default" "slow")
      "enabledModels" (list
        "openai-codex/gpt-5.6-sol"
        "openai-codex/gpt-5.6-luna"
        "openai-codex/gpt-5.6-terra"
        "openai-codex/gpt-6-astra"
        "devin/swe-2"
        "devin/deepseek-v4-1-flash"
        "devin/glm-5-3-flash-1m"
        "devin/gemini-3-8-flash"
        "devin/glm-5-3-1m"
        "anthropic/claude-opus-5"
        "anthropic/claude-sonnet-5"
        "anthropic/claude-haiku-4-5"
        "anthropic/claude-fable-5"
        "anthropic/claude-fable-5-1")
      "task" (dict
        "agentModelOverrides" (dict
          "sonic" "@smol"
          "task" "@task"
          "reviewer" "@review"
          "security-reviewer" "@slow")
        "agentAdvisor" (dict
          "scout" "off"
          "sonic" "off"
          "task" "off"
          "reviewer" "off"
          "security-reviewer" "off")
        "prewalk" false)
      "prewalk" (dict "enabled" false)
      "tier" (dict
        "openai" "none"
        "anthropic" "none"
        "subagent" "none"
        "advisor" "none")
-}}
{{- if .chezmoi.stdin -}}
{{-   $config = mergeOverwrite $config (fromYaml .chezmoi.stdin) -}}
{{- end -}}
{{- /* chezmoi で強制する設定 */ -}}
{{- $enforced := dict
      "modelRoles" (dict "judge" "anthropic/claude-haiku-4-5")
      "retry" (dict "fallbackChains" (dict "judge" (list "devin/swe-2")))
      "find" (dict "enabled" true)
      "astGrep" (dict "enabled" true)
      "github" (dict "enabled" true)
      "checkpoint" (dict "enabled" true)
      "security" (dict "enabled" true)
      "theme" (dict "dark" "dark-catppuccin" "light" "light-catppuccin")
      "symbolPreset" "nerd"
      "composer" (dict "shape" "claude" "tokenRate" true)
      "personality" "pragmatic"
      "startup" (dict "quiet" true)
      "showHardwareCursor" true
      "tui" (dict "imeSafeCursor" true)
      "statusLine" (dict "transparent" true)
      "terminal" (dict "showProgress" true)
      "display" (dict
        "cacheMissMarker" true
        "showTokenUsage" true
        "showTurnTime" true)
      "task" (dict
        "showResolvedModelBadge" true
        "agentModelOverrides" (dict "scout" "devin/swe-2:low"))
      "dev" (dict "autoqa" false)
-}}
{{- $config = mergeOverwrite $config $enforced -}}
{{- toYaml $config | trim -}}
