{{- /* chezmoi:modify-template */ -}}
{{- /* omp が実行時に書き換えるキーは既存の値を引き継ぐ（下は新規マシン向けの初期値） */ -}}
{{- $config := dict
      "providers" dict
      "setupVersion" 2
      "modelRoles" (dict
        "default" "anthropic/claude-fable-5-2:medium"
        "advisor" "openai-codex/gpt-6-astra:high"
        "smol" "anthropic/claude-opus-5-5:medium"
        "tiny" "anthropic/claude-haiku-5-5:auto"
        "task" "anthropic/claude-fable-5-2:medium"
        "plan" "anthropic/claude-fable-5-2:high"
        "slow" "openai-codex/gpt-6-astra:xhigh"
        "review" "openai-codex/gpt-6-astra:high"
        "review_openai" "openai-codex/gpt-6-astra:high"
        "review_anthropic" "anthropic/claude-fable-5-2:high")
      "advisor" (dict "enabled" true)
      "task" (dict
        "agentModelOverrides" (dict
          "sonic" "@smol"
          "task" "@task"
          "reviewer" "@review"
          "security-reviewer" "@slow")
        "agentAdvisor" (dict
          "scout" "off"
          "sonic" "off"
          "task" "off"
          "reviewer" "off"
          "security-reviewer" "off")
        "prewalk" false)
      "prewalk" (dict "enabled" false)
      "tier" (dict "anthropic" "none")
-}}
{{- if .chezmoi.stdin -}}
{{-   $config = mergeOverwrite $config (fromYaml .chezmoi.stdin) -}}
{{- end -}}
{{- /* chezmoi で強制する設定 */ -}}
{{- $enforced := dict
      "enabledModels" (list
        "openai-codex/gpt-6-astra"
        "openai-codex/gpt-6-luna"
        "openai-codex/gpt-6.1-sol"
        "openai-codex/gpt-6.1-terra"
        "openai-codex/gpt-daybreak-blue-latest"
        "devin/swe-2"
        "devin/deepseek-v4-1-flash"
        "devin/glm-5-3-flash-1m"
        "devin/gemini-3-8-flash"
        "devin/gemini-4-argon"
        "devin/glm-5-3-1m"
        "anthropic/claude-opus-5-5"
        "anthropic/claude-sonnet-5-5"
        "anthropic/claude-haiku-5-5"
        "anthropic/claude-fable-5-2"
        "anthropic/claude-mythos-5-2"
        "amazon-bedrock/*")
      "modelRoles" (dict "judge" "typesafe/jev-1.14.0")
      "cycleOrder" (list "smol" "default" "slow")
      "advisor" (dict "reviewInterval" 1)
      "retry" (dict
        "usageAwareFallback" true
        "usageReservePct" 10
        "usageReservePolicy" "fail-closed"
        "fallbackChains" (dict
          "judge" (list "anthropic/claude-haiku-5-5")
          "default" (list "anthropic/claude-opus-5-5:high")
          "plan" (list "anthropic/claude-opus-5-5:high")
          "task" (list "anthropic/claude-opus-5-5:high")
          "advisor" (list "anthropic/claude-opus-5-5:medium")
          "review" (list "anthropic/claude-opus-5-5:high")
          "slow" (list "anthropic/claude-fable-5-2:high")))
      "codexResets" (dict "autoRedeem" "no")
      "tier" (dict
        "openai" "ultrafast"
        "subagent" "ultrafast"
        "advisor" "ultrafast")
      "find" (dict "enabled" "on")
      "astGrep" (dict "enabled" true)
      "github" (dict "enabled" true)
      "checkpoint" (dict "enabled" true)
      "security" (dict "enabled" true)
      "secrets" (dict "enabled" true)
      "theme" (dict "dark" "dark-catppuccin" "light" "light-catppuccin")
      "symbolPreset" "nerd"
      "composer" (dict "shape" "claude" "tokenRate" true)
      "personality" "pragmatic"
      "startup" (dict "quiet" true)
      "showHardwareCursor" true
      "tui" (dict "imeSafeCursor" true "completeScrollback" true)
      "statusLine" (dict
        "preset" "custom"
        "leftSegments" (list "model" "mode" "path" "git" "pr")
        "rightSegments" (list "context_pct" "cost" "session_name")
        "transparent" true)
      "terminal" (dict "showProgress" true)
      "display" (dict
        "cacheMissMarker" true
        "showTokenUsage" true
        "showTurnTime" true
        "pinnedAgents" "full"
        "subagentLivePreview" true)
      "task" (dict
        "maxConcurrency" 8
        "enableLsp" true
        "enableEffort" true
        "maxRuntimeMs" 0
        "showResolvedModelBadge" true
        "agentModelOverrides" (dict "scout" "@smol"))
      "dev" (dict "autoqa" false)
      "gc" (dict "stale" true)
      "telemetry" (dict "otlpExportEnabled" false)
-}}
{{- $config = mergeOverwrite $config $enforced -}}
{{- toYaml $config | trim -}}
