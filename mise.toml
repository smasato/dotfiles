[tools]
hk = "latest"
"npm:prettier" = "latest"
pkl = "latest"
yq = "latest"

[tasks.sort]
description = "Sort package entries in .chezmoidata/packages.yaml"
run = '''yq -i 'sort_keys(.packages.darwin.*.*) | (.packages.darwin.*.* | select(tag == "!!seq")) |= sort' .chezmoidata/packages.yaml'''

[tasks.check-worktrunk]
description = "Check Worktrunk hooks, Claude plugin updates, Herdr lifecycle, and audit"
run = "python3 scripts/check-worktrunk.py"
