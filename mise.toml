[tools]
hk = "latest"
"npm:prettier" = "latest"
pkl = "latest"
yq = "latest"

[tasks.sort]
description = "Sort package entries in .chezmoidata/packages.yaml"
run = '''yq -i 'sort_keys(.packages.darwin.*.*) | (.packages.darwin.*.* | select(tag == "!!seq")) |= sort' .chezmoidata/packages.yaml'''

[tasks.check-worktrunk]
description = "Check Worktrunk hooks, Claude plugin updates, Herdr lifecycle, and audit"
run = "python3 scripts/check-worktrunk.py"

[tasks.update-herdr-plugins]
description = "Update Herdr plugins and record revisions with before/after integration checks"
run = "python3 scripts/update-herdr-plugins.py"

[tasks.check-worktrunk-plugins]
description = "Verify Worktrunk installation and enablement in existing Claude and Codex homes"
run = "python3 scripts/check-worktrunk-plugins.py"
