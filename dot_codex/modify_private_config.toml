{{- /* chezmoi:modify-template */ -}}
notify = ["{{ .chezmoi.homeDir }}/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

# Codex manages marketplaces, node_repl, and TUI state per machine.
# Trusted projects, hook trust hashes, and the NUX counter are Codex-written
# machine state, so the current values are passed through from the live file.
{{- $cur := dict }}
{{- if .chezmoi.stdin }}{{ $cur = fromToml .chezmoi.stdin }}{{ end }}

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[features]
hooks = true
js_repl = false

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = false
{{- $projects := dict .chezmoi.sourceDir (dict "trust_level" "trusted") }}
{{- range $k, $v := dig "projects" (dict) $cur }}{{ $_ := set $projects $k $v }}{{ end }}
{{- range $k, $v := $projects }}

[projects.{{ printf "%q" $k }}]
{{- range $fk, $fv := $v }}
{{ $fk }} = {{ if kindIs "string" $fv }}{{ printf "%q" $fv }}{{ else }}{{ $fv }}{{ end }}
{{- end }}
{{- end }}

[hooks.state]
{{- range $k, $v := dig "hooks" "state" (dict) $cur }}

[hooks.state.{{ printf "%q" $k }}]
{{- range $fk, $fv := $v }}
{{ $fk }} = {{ if kindIs "string" $fv }}{{ printf "%q" $fv }}{{ else }}{{ $fv }}{{ end }}
{{- end }}
{{- end }}

[tui.model_availability_nux]
{{- $nux := dig "tui" "model_availability_nux" (dict "gpt-5.6-sol" 1) $cur }}
{{- range $k, $v := $nux }}
{{ if regexMatch "^[A-Za-z0-9_-]+$" $k }}{{ $k }}{{ else }}{{ printf "%q" $k }}{{ end }} = {{ $v }}
{{- end }}
