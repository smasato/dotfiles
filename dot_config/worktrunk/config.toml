# Worktrunk user configuration
# https://worktrunk.dev/config/

[list]
# Keep schema 2 (envelope) explicit for consumers; it is the default since v0.77.
json-schema = 2

[pre-switch]
# When switching to a branch that doesn't exist locally, fetch first so the
# remote-tracking ref is available and wt can create a tracking branch from it.
# Skip detached HEAD and local branches. The case also handles any unresolved
# shortcuts; v0.76+ supplies the resolved branch for PR/MR switches.
# Fetch failure (e.g. offline) doesn't block the switch.
fetch = '''{% if branch %}branch={{ branch }}; case "$branch" in ''|-|@|^|pr:*|mr:*) ;; *) git show-ref --verify --quiet "refs/heads/$branch" || git fetch origin --prune || true ;; esac{% endif %}'''

[pre-start]
# Opt in with .worktreeinclude in the primary worktree. Only ignored files
# matching that file are copied, without overwriting existing destinations.
# Run synchronously on creation so later startup hooks can use local settings.
copy = "wt step copy-ignored --require-include"

[post-switch]
# Open the worktree in Herdr with the standard layout (shell + file viewer in
# tab 1, lazygit tab, yazi tab). post-switch rather than post-start so it also
# fires when switching to an already-existing worktree, e.g. via the herdr
# worktrunk plugin picker. The script itself skips workspaces that are already
# laid out. Skip the primary worktree; ignore failure when the server is not
# running.
# A detached worktree uses its short commit SHA as the workspace label.
herdr = "[ {{ worktree_path }} = {{ primary_worktree_path }} ] || bash ~/.config/herdr/scripts/worktree-open.sh {{ repo_path }} {{ worktree_path }} {% if branch %}{{ branch }}{% else %}{{ short_commit }}{% endif %} || true"

[pre-remove]
# Capture the workspace and terminal identities while the checkout still exists.
herdr = "bash ~/.config/herdr/scripts/worktree-close.sh capture {{ worktree_path }} || true"

[post-remove]
# Queue the captured identity in pueue's process group. The worker rechecks the
# socket, workspace, terminals, and checkout absence before closing anything.
herdr = "bash ~/.config/herdr/scripts/worktree-close.sh queue-close {{ worktree_path }} || true"
