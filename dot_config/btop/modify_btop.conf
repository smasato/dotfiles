{{- /* chezmoi:modify-template */ -}}
{{- /* btop rewrites btop.conf on exit; keep its output and pin only the theme keys. */ -}}
{{- $pins := dict "color_theme" `"catppuccin_mocha"` "theme_background" "false" -}}
{{- $conf := .chezmoi.stdin | trimSuffix "\n" -}}
{{- range $key, $value := $pins -}}
{{-   $line := printf "%s = %s" $key $value -}}
{{-   $pattern := printf `(?m)^%s = .*$` $key -}}
{{-   if regexMatch $pattern $conf -}}
{{-     $conf = regexReplaceAll $pattern $conf $line -}}
{{-   else -}}
{{-     $conf = list $conf $line | compact | join "\n" -}}
{{-   end -}}
{{- end -}}
{{ $conf }}
