[tools]
# languages
ruby = "3.4.3"
bun = "1.2.16"
node = "24.2.0"
python = "3.11"
rust = "latest"

# tools
gh = "latest"
vivid = "latest"
ghq = "latest"
ripgrep = "latest"
fd = "latest"
atuin = "latest"
ast-grep = "latest"
bat = "latest"
jq = "latest"
starship = "latest"
fzf = "latest"
tmux = "latest"
herdr = "latest"
usage = "latest"
hk = "latest"
"github:aubepkg/aube" = "latest"
worktrunk = "latest"
hunk = "latest"
grok = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:vercel-labs/fx" = "latest"
neovim = "latest"
lazygit = "latest"
glow = "latest"
shellcheck = "latest"
yq = "latest"

# npm packages
claude-code = "latest"
codex = "latest"
"npm:ccusage" = "latest"
"npm:prettier" = "latest"
"npm:skills" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:agent-browser" = "latest"
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = ["@opencode-ai/cli"] }
# RC pin: mise's latest resolution omits these releases. The pinned Git dependency
# requires: MISE_NPM_PACKAGE_MANAGER=npm mise install npm:@probelabs/probe
"npm:@probelabs/probe" = { version = "0.6.0-rc339", allow_builds = ["@probelabs/probe"] }

[settings]
env_file = '.env'
experimental = true
idiomatic_version_file_enable_tools = []

[settings.ruby]
# precompiled binaries only; never fetch ruby-build and compile from source
compile = false

[settings.task]
output = "prefix"
